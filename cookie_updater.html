<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Farmer — Панель управления</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0b0c0e;
    --surface: #13151a;
    --border:  #1e2128;
    --text:    #c9cdd6;
    --muted:   #4a4f5c;
    --accent:  #3b82f6;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #f59e0b;
    --radius:  8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .layout {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 15px; color: #fff; letter-spacing: .06em; }
  .header .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .card-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* ── Bot controls ── */
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: 6px;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    user-select: none;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .btn-green  { background: #16341f; border-color: #1a5c2a; color: var(--green); }
  .btn-red    { background: #341616; border-color: #5c1a1a; color: var(--red); }
  .btn-blue   { background: #162034; border-color: #1a3a5c; color: var(--accent); }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  .dot-yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .dot-red   { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .4; }
  }

  #bot-status-text { font-size: 13px; color: var(--text); }

  /* ── Cookie section ── */
  .bookmarklet-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0d0f13;
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .bm-link {
    display: inline-block;
    background: #162034;
    color: #7eb8f7;
    border: 1px solid #1a3a5c;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
    cursor: grab;
    flex-shrink: 0;
  }
  .bm-hint { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .cookie-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }
  .cookie-status.ok  { color: var(--green); }
  .cookie-status.err { color: var(--red); }

  details { margin-top: 14px; }
  summary {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 0;
    user-select: none;
  }
  summary:hover { color: #666; }

  textarea {
    width: 100%;
    margin-top: 10px;
    background: #0d0f13;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #aaa;
    font-family: inherit;
    font-size: 11px;
    padding: 10px;
    resize: vertical;
    min-height: 70px;
    outline: none;
  }
  textarea:focus { border-color: #333; }

  /* ── Logs ── */
  #log-box {
    background: #0a0b0d;
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 380px;
    overflow-y: auto;
    padding: 10px 12px;
    font-size: 11.5px;
    line-height: 1.7;
    scroll-behavior: smooth;
  }

  .log-line { display: flex; gap: 8px; }
  .log-t    { color: #333; flex-shrink: 0; }
  .log-INFO    { color: #7eb8f7; }
  .log-WARNING { color: var(--yellow); }
  .log-ERROR   { color: var(--red); }
  .log-DEBUG   { color: #555; }

  .log-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .log-controls span { font-size: 11px; color: var(--muted); }
  .log-scroll-btn {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    padding: 2px 6px;
  }
  .log-scroll-btn:hover { color: var(--text); }
</style>
</head>
<body>
<div class="layout">

  <!-- Header -->
  <div class="header">
    <div>
      <h1>🤖 Hub Farmer</h1>
      <div class="sub">Панель управления</div>
    </div>
  </div>

  <!-- Bot Control -->
  <div class="card">
    <div class="card-title">Управление ботом</div>
    <div class="controls">
      <span class="status-dot" id="status-dot"></span>
      <span id="bot-status-text">Загрузка...</span>
      <button class="btn btn-green" id="btn-resume" onclick="botResume()">▶ Запустить</button>
      <button class="btn btn-red"   id="btn-pause"  onclick="botPause()">⏸ Пауза</button>
    </div>
  </div>

  <!-- Cookie -->
  <div class="card">
    <div class="card-title">Обновление куки</div>

    <div class="bookmarklet-row">
      <a class="bm-link" href="javascript:(function(){var s=document.cookie;fetch('http://localhost:8765/update-cookies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookies:s})}).then(r=>r.json()).then(d=>alert(d.ok?'✅ Куки обновлены!':'❌ '+d.error)).catch(e=>alert('❌ '+e));})();">
        🔖 Обновить куки
      </a>
      <span class="bm-hint">Перетащи в панель закладок → зайди на astanahub.com → кликни</span>
    </div>

    <div class="cookie-status" id="cookie-status">⏳ Проверка...</div>

    <details>
      <summary>Вставить вручную</summary>
      <textarea id="manual-cookies" placeholder="cookie: _fbp=...; sessionid=...; csrftoken=..."></textarea>
      <div style="margin-top:8px">
        <button class="btn btn-blue" onclick="sendManual()">Отправить</button>
      </div>
    </details>
  </div>

  <!-- Logs -->
  <div class="card">
    <div class="card-title">Логи</div>
    <div class="log-controls">
      <span id="log-count">0 строк</span>
      <div style="display:flex;gap:6px">
        <button class="log-scroll-btn" onclick="clearLogs()">очистить</button>
        <button class="log-scroll-btn" id="auto-scroll-btn" onclick="toggleAutoScroll()">⬇ авто-скролл: вкл</button>
      </div>
    </div>
    <div id="log-box"></div>
  </div>

</div>

<script>
  let autoScroll = true;
  let logCount   = 0;
  const logBox   = document.getElementById('log-box');

  // ── Logs via SSE ──────────────────────────────────────────────────────────
  function connectLogs() {
    const es = new EventSource('/logs');
    es.onmessage = e => {
      try { appendLog(JSON.parse(e.data)); } catch {}
    };
    es.onerror = () => {
      setTimeout(connectLogs, 3000);
      es.close();
    };
  }

  function appendLog(entry) {
    const line = document.createElement('div');
    line.className = 'log-line';

    const t   = document.createElement('span');
    t.className = 'log-t';
    t.textContent = entry.t;

    const msg = document.createElement('span');
    msg.className = 'log-' + (entry.lvl || 'INFO');
    msg.textContent = entry.msg;

    line.appendChild(t);
    line.appendChild(msg);
    logBox.appendChild(line);
    logCount++;
    document.getElementById('log-count').textContent = logCount + ' строк';

    if (autoScroll) logBox.scrollTop = logBox.scrollHeight;
  }

  function clearLogs() {
    logBox.innerHTML = '';
    logCount = 0;
    document.getElementById('log-count').textContent = '0 строк';
  }

  function toggleAutoScroll() {
    autoScroll = !autoScroll;
    document.getElementById('auto-scroll-btn').textContent =
      '⬇ авто-скролл: ' + (autoScroll ? 'вкл' : 'выкл');
    if (autoScroll) logBox.scrollTop = logBox.scrollHeight;
  }

  // ── Bot status ────────────────────────────────────────────────────────────
  function updateBotStatus() {
    fetch('/bot-status')
      .then(r => r.json())
      .then(d => {
        const dot  = document.getElementById('status-dot');
        const text = document.getElementById('bot-status-text');
        const btnR = document.getElementById('btn-resume');
        const btnP = document.getElementById('btn-pause');

        if (d.paused) {
          dot.className  = 'status-dot dot-yellow';
          text.textContent = 'На паузе';
          btnR.disabled = false;
          btnP.disabled = true;
        } else {
          dot.className  = 'status-dot dot-green';
          text.textContent = 'Работает';
          btnR.disabled = true;
          btnP.disabled = false;
        }
      })
      .catch(() => {
        document.getElementById('status-dot').className = 'status-dot dot-red';
        document.getElementById('bot-status-text').textContent = 'Недоступен';
      });
  }

  function botPause() {
    fetch('/bot/pause', { method: 'POST' }).then(() => updateBotStatus());
  }

  function botResume() {
    fetch('/bot/resume', { method: 'POST' }).then(() => updateBotStatus());
  }

  // ── Cookie status ─────────────────────────────────────────────────────────
  function updateCookieStatus() {
    fetch('/cookie-status')
      .then(r => r.json())
      .then(d => {
        const el = document.getElementById('cookie-status');
        if (d.ok && d.updated_at) {
          el.className = 'cookie-status ok';
          el.textContent = '✅ Куки актуальны · обновлено: ' +
            new Date(d.updated_at).toLocaleString('ru');
        } else {
          el.className = 'cookie-status err';
          el.textContent = '❌ Куки не загружены';
        }
      });
  }

  function sendManual() {
    const raw = document.getElementById('manual-cookies').value.trim();
    if (!raw) return;
    // Убираем "cookie:" префикс если есть
    const cs = raw.replace(/^cookie:\s*/i, '');
    fetch('/update-cookies', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookies: cs })
    })
    .then(r => r.json())
    .then(d => {
      if (d.ok) updateCookieStatus();
      else alert('Ошибка: ' + d.error);
    });
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  connectLogs();
  updateBotStatus();
  updateCookieStatus();
  setInterval(updateBotStatus,    5000);
  setInterval(updateCookieStatus, 15000);
</script>
</body>
</html>
