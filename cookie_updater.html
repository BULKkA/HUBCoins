<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Farmer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0b0c0e;
    --surface: #13151a;
    --border:  #1e2128;
    --text:    #c9cdd6;
    --muted:   #4a4f5c;
    --accent:  #3b82f6;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #f59e0b;
    --radius:  8px;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .layout { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 15px; color: #fff; letter-spacing: .06em; }
  .header .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .card-title { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 14px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: 6px; border: 1px solid transparent;
    font-family: inherit; font-size: 13px; cursor: pointer;
    transition: opacity .15s, transform .1s; user-select: none;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-green { background: #16341f; border-color: #1a5c2a; color: var(--green); }
  .btn-red   { background: #341616; border-color: #5c1a1a; color: var(--red); }
  .btn-blue  { background: #162034; border-color: #1a3a5c; color: var(--accent); }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-green  { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  .dot-yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .dot-red    { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* Cookie */
  .steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .step { display: flex; gap: 10px; align-items: flex-start; }
  .step-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: #1e2128; color: var(--muted);
    font-size: 11px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .step-text { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .step-text code {
    background: #0d0f13; border: 1px solid #222;
    border-radius: 4px; padding: 1px 6px;
    color: #7eb8f7; font-family: inherit; font-size: 11px;
  }

  .cookie-input-row { display: flex; gap: 8px; align-items: flex-start; }
  textarea {
    flex: 1; background: #0d0f13; border: 1px solid var(--border);
    border-radius: 6px; color: #aaa; font-family: inherit;
    font-size: 11px; padding: 10px; resize: vertical; min-height: 72px; outline: none;
  }
  textarea:focus { border-color: #2a3040; }
  textarea::placeholder { color: #2a2f3a; }

  .cookie-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted); margin-top: 12px;
    padding: 8px 12px; background: #0d0f13;
    border: 1px solid var(--border); border-radius: 6px;
  }
  .cookie-status.ok  { color: var(--green); border-color: #1a3a22; background: #0a1810; }
  .cookie-status.err { color: var(--red);   border-color: #3a1a1a; background: #180a0a; }

  /* Logs */
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .log-meta { font-size: 11px; color: var(--muted); }
  .log-actions { display: flex; gap: 4px; }
  .log-btn {
    font-size: 11px; color: var(--muted); cursor: pointer;
    background: #1a1c22; border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 8px; font-family: inherit;
  }
  .log-btn:hover { color: var(--text); border-color: #333; }

  #log-box {
    background: #080a0d; border: 1px solid var(--border); border-radius: 6px;
    height: 400px; overflow-y: auto; padding: 10px 12px;
    font-size: 11.5px; line-height: 1.75;
  }
  .log-line { display: flex; gap: 10px; }
  .log-t    { color: #2a2f3a; flex-shrink: 0; min-width: 56px; }
  .log-INFO    { color: #7eb8f7; }
  .log-WARNING { color: var(--yellow); }
  .log-ERROR   { color: var(--red); }
  .log-DEBUG   { color: #333; }

  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #1a1c22; border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 16px; font-size: 12px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.ok  { border-color: #1a5c2a; color: var(--green); }
  .toast.err { border-color: #5c1a1a; color: var(--red); }
</style>
</head>
<body>
<div class="layout">

  <div class="header">
    <div>
      <h1>🤖 Hub Farmer</h1>
      <div class="sub">Панель управления</div>
    </div>
  </div>

  <!-- Bot Control -->
  <div class="card">
    <div class="card-title">Управление ботом</div>
    <div class="controls">
      <span class="status-dot" id="status-dot"></span>
      <span id="bot-status-text">Загрузка...</span>
      <button class="btn btn-green" id="btn-resume" onclick="botResume()">▶ Запустить</button>
      <button class="btn btn-red"   id="btn-pause"  onclick="botPause()">⏸ Пауза</button>
    </div>
  </div>

  <!-- Cookie -->
  <div class="card">
    <div class="card-title">Обновление куки</div>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">Зайди на <code>astanahub.com</code> в браузере</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text">Открой DevTools <code>F12</code> → вкладка <code>Network</code> → фильтр <code>Fetch/XHR</code></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text">Найди любой запрос → <code>Headers</code> → скопируй строку <code>cookie: ...</code></div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <div class="step-text">Вставь ниже и нажми <code>Обновить</code></div>
      </div>
    </div>

    <div class="cookie-input-row">
      <textarea id="cookie-input" placeholder="_fbp=...; sessionid=...; csrftoken=..."></textarea>
      <button class="btn btn-blue" style="flex-shrink:0;height:72px" onclick="sendCookies()">Обновить</button>
    </div>

    <div class="cookie-status err" id="cookie-status">❌ Куки не загружены</div>
  </div>

  <!-- Logs -->
  <div class="card">
    <div class="card-title">Логи</div>
    <div class="log-header">
      <span class="log-meta" id="log-count">0 строк</span>
      <div class="log-actions">
        <button class="log-btn" onclick="clearLogs()">очистить</button>
        <button class="log-btn" id="as-btn" onclick="toggleAutoScroll()">⬇ авто</button>
      </div>
    </div>
    <div id="log-box"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  let autoScroll = true;
  let logCount   = 0;
  const logBox   = document.getElementById('log-box');

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(msg, type = 'ok') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.className = 'toast', 2500);
  }

  // ── Logs SSE ──────────────────────────────────────────────────────────────
  function connectLogs() {
    const es = new EventSource('/logs');
    es.onmessage = e => { try { appendLog(JSON.parse(e.data)); } catch {} };
    es.onerror   = () => { es.close(); setTimeout(connectLogs, 3000); };
  }

  function appendLog(entry) {
    const line = document.createElement('div');
    line.className = 'log-line';
    const t = document.createElement('span');
    t.className = 'log-t';
    t.textContent = entry.t;
    const m = document.createElement('span');
    m.className = 'log-' + (entry.lvl || 'INFO');
    m.textContent = entry.msg;
    line.appendChild(t);
    line.appendChild(m);
    logBox.appendChild(line);
    logCount++;
    document.getElementById('log-count').textContent = logCount + ' строк';
    if (autoScroll) logBox.scrollTop = logBox.scrollHeight;
  }

  function clearLogs() { logBox.innerHTML = ''; logCount = 0; document.getElementById('log-count').textContent = '0 строк'; }

  function toggleAutoScroll() {
    autoScroll = !autoScroll;
    document.getElementById('as-btn').textContent = '⬇ авто: ' + (autoScroll ? 'вкл' : 'выкл');
    if (autoScroll) logBox.scrollTop = logBox.scrollHeight;
  }

  // ── Bot ───────────────────────────────────────────────────────────────────
  function updateBotStatus() {
    fetch('/bot-status').then(r => r.json()).then(d => {
      const dot  = document.getElementById('status-dot');
      const text = document.getElementById('bot-status-text');
      const btnR = document.getElementById('btn-resume');
      const btnP = document.getElementById('btn-pause');
      if (d.paused) {
        dot.className = 'status-dot dot-yellow';
        text.textContent = 'На паузе';
        btnR.disabled = false; btnP.disabled = true;
      } else {
        dot.className = 'status-dot dot-green';
        text.textContent = 'Работает';
        btnR.disabled = true; btnP.disabled = false;
      }
    }).catch(() => {
      document.getElementById('status-dot').className = 'status-dot dot-red';
      document.getElementById('bot-status-text').textContent = 'Недоступен';
    });
  }

  function botPause()  { fetch('/bot/pause',  { method: 'POST' }).then(() => updateBotStatus()); }
  function botResume() { fetch('/bot/resume', { method: 'POST' }).then(() => updateBotStatus()); }

  // ── Cookies ───────────────────────────────────────────────────────────────
  function updateCookieStatus() {
    fetch('/cookie-status').then(r => r.json()).then(d => {
      const el = document.getElementById('cookie-status');
      if (d.ok && d.updated_at) {
        el.className = 'cookie-status ok';
        el.textContent = '✅ Куки актуальны · ' + new Date(d.updated_at).toLocaleString('ru');
      } else {
        el.className = 'cookie-status err';
        el.textContent = '❌ Куки не загружены';
      }
    });
  }

  function sendCookies() {
    let raw = document.getElementById('cookie-input').value.trim();
    if (!raw) { showToast('Вставь строку куки', 'err'); return; }
    // убираем "cookie:" префикс если скопировали с ним
    raw = raw.replace(/^cookie:\s*/i, '');
    fetch('/update-cookies', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookies: raw })
    })
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        showToast('✅ Куки обновлены!');
        document.getElementById('cookie-input').value = '';
        updateCookieStatus();
      } else {
        showToast('❌ ' + d.error, 'err');
      }
    })
    .catch(() => showToast('❌ Ошибка соединения', 'err'));
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  connectLogs();
  updateBotStatus();
  updateCookieStatus();
  setInterval(updateBotStatus,    5000);
  setInterval(updateCookieStatus, 15000);
</script>
</body>
</html>
